spring.application.name=flight-ai-agent

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2

#ToolCallingAdvisor is automatically registered by ChatClient unless it has been disabled.
spring.ai.chat.client.tool-calling.enabled=true


# H2 Database configuration 
spring.datasource.url=jdbc:h2:mem:flightdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console